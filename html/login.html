<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Blog Informativo</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>


<div class="split-screen">
    <div class="left-panel">
        <div class="panel-content">
            <h2>Institut<strong>Drogas</strong></h2>
            <p>"La educación es el arma más poderosa para cambiar el mundo."</p>
            <a href="../index.html" class="btn-back">← Volver al inicio</a>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-box">
            <div class="login-header">
                <h3>Acceso Profesional</h3>
                <p>Bienvenido, por favor ingrese sus credenciales.</p>
            </div>

            <form>
                <div class="input-group">
                    <label for="username">Usuario / Email</label>
                    <input type="text" id="username" name="username" placeholder="ejemplo@institutdrogas.org" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="forgot-password">Recuperar contraseña</a>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <p>¿Aún no es miembro? <a href="#">Solicitar acceso</a></p>
            </div>
        </div>
    </div>
</div>

</body>

</html>
